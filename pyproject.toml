[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-beacon"
version = "0.1.0"
description = "Drive a smart bulb or webhook from Claude Code session state."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Saiem Gilani" }]
keywords = ["claude", "claude-code", "smart-home", "kasa", "tapo", "webhook", "ntfy", "status-indicator"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "python-kasa>=0.7.0",
    "httpx>=0.27",
    "click>=8.1",
    "platformdirs>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
]

[project.scripts]
claude-beacon = "claude_beacon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_beacon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:asyncio",
]
